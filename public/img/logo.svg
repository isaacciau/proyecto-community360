<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Community 360</title>
  <defs>
    <!-- Fondo: morado intenso a cian -->
    <linearGradient id="fondo" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b6bff"/>
      <stop offset="0.5" stop-color="#6a4dff"/>
      <stop offset="1" stop-color="#00c8f5"/>
    </linearGradient>
    <!-- Brillo de cristal en la esquina superior -->
    <radialGradient id="brillo" cx="16" cy="10" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Sombra profunda abajo -->
    <linearGradient id="profundidad" x1="0" y1="34" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#140a4d" stop-opacity="0"/>
      <stop offset="1" stop-color="#140a4d" stop-opacity="0.35"/>
    </linearGradient>
    <!-- Relleno de la letra C -->
    <linearGradient id="letra" x1="18" y1="16" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4f3ff"/>
    </linearGradient>
    <!-- Halo de la órbita -->
    <linearGradient id="orbita" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="sombraC" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#1b0b66" flood-opacity="0.55"/>
    </filter>
    <filter id="resplandor" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="marco"><rect width="64" height="64" rx="18"/></clipPath>
  </defs>

  <!-- Base -->
  <g clip-path="url(#marco)">
    <rect width="64" height="64" fill="url(#fondo)"/>
    <!-- Círculos decorativos de fondo -->
    <circle cx="54" cy="56" r="20" fill="#00e0ff" opacity="0.25"/>
    <circle cx="6" cy="60" r="14" fill="#ff5c8a" opacity="0.18"/>
    <rect width="64" height="64" fill="url(#profundidad)"/>
    <rect width="64" height="64" fill="url(#brillo)"/>
  </g>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Órbita 360 que gira lentamente -->
  <g>
    <ellipse cx="32" cy="32" rx="25" ry="9.5" fill="none" stroke="url(#orbita)" stroke-width="1.3" transform="rotate(-28 32 32)"/>
    <ellipse cx="32" cy="32" rx="25" ry="9.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.9" stroke-dasharray="1.5 3.2" transform="rotate(-28 32 32)"/>
    <!-- Satélite que recorre la órbita -->
    <g transform="rotate(-28 32 32)">
      <circle r="2.1" fill="#ffffff" filter="url(#resplandor)">
        <animateMotion dur="9s" repeatCount="indefinite" path="M57 32 A25 9.5 0 1 1 7 32 A25 9.5 0 1 1 57 32"/>
      </circle>
    </g>
  </g>

  <!-- Letra C -->
  <path d="M42.6 21.4 A15 15 0 1 0 42.6 42.6" fill="none" stroke="url(#letra)" stroke-width="7.2" stroke-linecap="round" filter="url(#sombraC)"/>
  <!-- Línea interior de brillo sobre la C -->
  <path d="M38.2 19.6 A12.6 12.6 0 0 0 20.2 27" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Nodos de la comunidad en las puntas de la C -->
  <circle cx="42.6" cy="21.4" r="3.9" fill="#ff5c8a" stroke="#ffffff" stroke-width="1.6"/>
  <circle cx="42.6" cy="42.6" r="3.9" fill="#2ee6a6" stroke="#ffffff" stroke-width="1.6"/>
  <!-- Nodo central -->
  <circle cx="33.5" cy="32" r="2.8" fill="#ffe066" stroke="#ffffff" stroke-width="1.3">
    <animate attributeName="r" values="2.8;3.4;2.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- Conexiones entre nodos -->
  <path d="M40 23.6 L35 30 M40 40.4 L35 34" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="1.2 1.6"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
